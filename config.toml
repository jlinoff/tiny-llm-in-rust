# config.toml: settings for the LLM flow's steps 3–6 (PLAN.md, "Configuration").
# Each step reads only its own section. TOML: "key = value", '#' starts a comment.

# [model] is read by step 3, build, and copied into the checkpoint; the later
# steps read the shapes from the checkpoint, never from here. V (the
# vocabulary size) isn't set here: it comes from the tokenizer (tok.bpe).
[model]
d_model = 128   # the model width d: the length of every token's vector
layers  = 4     # transformer blocks, applied one after another
heads   = 4     # attention heads per block; must divide d_model (head size 32)
context = 128   # the most tokens the model sees at once (T)
d_ff    = 512   # the FFN's inner width, conventionally 4 × d_model
seed    = 1     # random seed for the initial weights

# [training] is read by step 4, train, and copied into each checkpoint it
# writes. Only the first three are required; the rest show their defaults.
[training]
learning_rate = 0.002   # peak learning rate, reached after the warm-up
steps         = 2000    # train until this step (counted across resumes)
batch_size    = 16      # sequences per step, each `context` tokens long
warmup_steps  = 100     # the learning rate rises linearly from 0 over these
min_lr_fraction = 0.1   # then falls along a cosine curve to this fraction
weight_decay  = 0.1     # AdamW decay, for matrices and embeddings only
grad_clip     = 1.0     # scale the gradient down if its length exceeds this
beta1         = 0.9     # Adam's averaging rate for the gradient…
beta2         = 0.95    # …and for its square
seed          = 1       # for choosing the training windows
validation_fraction = 0.05  # the last 5% of the data, held out
log_every     = 50      # print a progress line every this many steps
eval_every    = 250     # measure the validation loss every this many steps
eval_batches  = 10      # validation batches per measurement
checkpoint_every = 500  # write a checkpoint every this many steps

# [generate] is read by step 6, generate. Every key is optional (these are
# the defaults), and each can be overridden on the command line, such as
# --temperature 0.5.
[generate]
max_tokens  = 200   # stop after this many new tokens, or earlier at end of text
temperature = 0.8   # below 1 favors likely tokens, above 1 flattens; 0 = greedy
top_k       = 40    # sample only from the 40 likeliest tokens; 0 = no cutoff
seed        = 1     # same seed + same prompt = same text

