# Continuous integration: on every push to main and every pull request, check
# that the code is formatted, lint-free and passes its tests, and that the
# whole flow (tokenizer to probe) still runs, on a tiny corpus
# (tools/ci/smoke.sh). On macOS the transformer is also built and tested with
# Apple's Accelerate library (the blas feature). `make test` runs the same
# checks locally; keep the two in step.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            features: ""
          - os: macos-latest
            features: "--features blas"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            transformer
            attention
            word2vec
      - name: Formatting
        run: |
          for d in transformer attention word2vec; do
            (cd "$d" && cargo fmt --check)
          done
      - name: Lint
        run: |
          (cd transformer && cargo clippy --release --all-targets ${{ matrix.features }} -- -D warnings)
          (cd attention && cargo clippy --release --all-targets -- -D warnings)
          (cd word2vec && cargo clippy --release --all-targets -- -D warnings)
      - name: Tests
        run: |
          (cd transformer && cargo test --release ${{ matrix.features }})
          (cd attention && cargo test --release)
          (cd word2vec && cargo test --release)
      - name: The whole flow on a tiny corpus
        run: |
          cargo build --release --manifest-path transformer/Cargo.toml ${{ matrix.features }}
          tools/ci/smoke.sh

  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Lint
        # llama_reference.py imports torch and transformers only when run;
        # they're not installed here, hence --disable=import-error.
        run: |
          pip install pylint==4.1.3
          pylint --disable=import-error tokenizer/*.py chat/*.py tools/*.py
      - name: Unit tests
        run: |
          python3 -m unittest discover -s tokenizer -v
          python3 -m unittest discover -s chat -v
      - name: PLAN.md's table of contents and internal links
        run: python3 tools/toc.py --check PLAN.md
