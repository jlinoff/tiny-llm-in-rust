# Drawing, part 1: pixels as tokens (PLAN.md, Drawing). Read by
# transformer draw-build ([model]) and draw-train ([training], [draw]).

[model]
d_model = 128   # the development model's size, as config.toml
layers  = 4
heads   = 4     # head size 32
context = 784   # a whole image: the class token and 783 pixels in,
                # pixels 1 to 784 out (PLAN.md, Drawing, "An image as a sentence")
d_ff    = 512
seed    = 1

[training]
learning_rate = 0.002   # as config.toml
steps         = 2400    # PROVISIONAL: set from the 50-step timing run so
                        # training takes about 30 minutes on the M4
batch_size    = 8       # images per step: 8 × 784 = 6,272 tokens; attention
                        # over 784 positions keeps 8 × 4 heads × 784² weights
                        # a layer, about 80 MB, so 8 rather than more
warmup_steps  = 100
min_lr_fraction = 0.1
weight_decay  = 0.1
grad_clip     = 1.0
beta1         = 0.9
beta2         = 0.95
seed          = 1       # for the order of the images and the dropped classes
validation_fraction = 0.0   # unused: validation is on MNIST's test images
log_every     = 25
eval_every    = 200     # validation: 10 batches of 8 test images
eval_batches  = 10
checkpoint_every = 200

[draw]
drop = 0.1      # the class token becomes <none> for 10% of the images (guidance)
