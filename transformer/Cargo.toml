[package]
name = "mini_transformer"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
description = "A small GPT-style language model: build, train, generate, finetune"

[[bin]]
name = "transformer"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
fancy-regex = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rayon = "1"
toml = "0.8"

[features]
# Large f32 matrix products through a BLAS library: Apple's Accelerate on
# macOS (cargo build --release --features blas). See src/blas.rs.
blas = []

[profile.release]
codegen-units = 1
lto = true
